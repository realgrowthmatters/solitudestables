  <path d="M24 80 A33 33 0 1 1 76 80" fill="none" stroke="#8a2f20" stroke-width="13" stroke-linecap="round"/>
  <!-- Nail holes -->
  <g fill="#f5ead2">
    <circle cx="23.5" cy="60" r="2.5"/>
    <circle cx="30" cy="36" r="2.5"/>
    <circle cx="50" cy="24.5" r="2.5"/>
    <circle cx="70" cy="36" r="2.5"/>
    <circle cx="76.5" cy="60" r="2.5"/>
  </g>
  <!-- Pine tree -->
  <g>
    <rect x="47.3" y="63" width="5.4" height="8.5" rx="1.4" fill="#5a3c24"/>
    <polygon points="50,33 41,51 59,51" fill="#2f4a36"/>
    <polygon points="50,42 38.5,60 61.5,60" fill="#37563f"/>
    <polygon points="50,50 36,67 64,67" fill="#2f4a36"/>
  </g>
